<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B2B Lead ROI & Outreach Calculator - Free Growth Tool</title>
    <meta name="description" content="Calculate the return on investment (ROI) for your cold outreach campaigns instantly.">
    <script src="https://jsdelivr.net"></script>
    <style>
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>

        <!-- Programmatic Monetag Ad Integration -->
        <script src="https://alwingulla.com" data-zone="8888888" defer></script>
        
</head>
<body class="bg-gradient-to-br from-slate-50 to-slate-200 min-h-screen text-slate-800 flex flex-col justify-between">

    <!-- Header / Branding -->
    <header class="p-6 text-center border-b border-slate-200 glass">
        <h1 class="text-3xl font-extrabold tracking-tight bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-transparent">
            B2B Lead ROI Calculator
        </h1>
        <p class="text-sm text-slate-500 mt-2">Optimize your sales development math without server cost.</p>
    </header>

    <!-- Main Tool Container -->
    <main class="flex-grow flex items-center justify-center p-4">
        <div class="w-full max-w-xl p-8 rounded-2xl shadow-xl glass">
            <div class='space-y-4'><label class='block text-sm font-semibold'>Number of Target Leads</label><input type='number' id='leads' value='1000' class='w-full p-2 border border-slate-300 rounded-lg'><label class='block text-sm font-semibold'>Average Deal Value ($)</label><input type='number' id='dealValue' value='500' class='w-full p-2 border border-slate-300 rounded-lg'><button onclick='calculateROI()' class='w-full bg-blue-600 text-white p-3 rounded-lg font-bold hover:bg-blue-700 transition'>Calculate Potential Revenue</button><div id='result' class='mt-4 p-4 bg-slate-50 border border-slate-200 rounded-lg hidden'><p class='text-sm text-slate-600'>Estimated Revenue (at 1% conversion):</p><p id='revOutput' class='text-2xl font-black text-green-600'>$0</p></div></div>
        </div>
    </main>

    <!-- Traffic Loop & Monetization Ad Layout -->
    <footer class="p-6 text-center border-t border-slate-200 glass text-xs text-slate-500">
        <p class="mb-4">Powered by B2B Suite | Need raw data? 
            <a href="https://rapidapi.com" target="_blank" class="text-blue-600 font-bold hover:underline">
                Access our Model 2 Lead Generation API
            </a>
        </p>
    </footer>

    <!-- JavaScript Logic -->
    <script>
        function calculateROI(){ const leads = document.getElementById('leads').value; const val = document.getElementById('dealValue').value; const conversions = Math.floor(leads * 0.01); const revenue = conversions * val; document.getElementById('revOutput').innerText = '$' + revenue.toLocaleString(); document.getElementById('result').classList.remove('hidden'); }
    </script>
</body>
</html>
