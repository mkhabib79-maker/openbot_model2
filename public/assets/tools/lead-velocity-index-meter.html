<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B2B Lead Velocity Index Meter</title>
    <meta name="description" content="Track how fast your sales pipeline is expanding week over week.">
    <script src="https://jsdelivr.net"></script>
    <style>
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>

        <!-- Programmatic Monetag Ad Integration -->
        <script src="https://alwingulla.com" data-zone="8888888" defer></script>
        
</head>
<body class="bg-gradient-to-br from-slate-50 to-slate-200 min-h-screen text-slate-800 flex flex-col justify-between">

    <!-- Header / Branding -->
    <header class="p-6 text-center border-b border-slate-200 glass">
        <h1 class="text-3xl font-extrabold tracking-tight bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-transparent">
            Pipeline Velocity Meter
        </h1>
        <p class="text-sm text-slate-500 mt-2">Measure pipeline velocity acceleration rate.</p>
    </header>

    <!-- Main Tool Container -->
    <main class="flex-grow flex items-center justify-center p-4">
        <div class="w-full max-w-xl p-8 rounded-2xl shadow-xl glass">
            <div class='space-y-4'><label class='block text-sm font-semibold'>Qualified Opportunities</label><input type='number' id='opps' value='50' class='w-full p-2 border border-slate-300 rounded-lg'><label class='block text-sm font-semibold'>Win Rate Percentage (%)</label><input type='number' id='winRate' value='20' class='w-full p-2 border border-slate-300 rounded-lg'><button onclick='calculateVelocity()' class='w-full bg-emerald-600 text-white p-3 rounded-lg font-bold hover:bg-emerald-700 transition'>Compute Velocity Index</button><div id='velResult' class='mt-4 p-4 bg-slate-50 border border-slate-200 rounded-lg hidden'><p class='text-sm text-slate-600'>Pipeline Velocity Coefficient:</p><p id='velOutput' class='text-2xl font-black text-emerald-600'>0</p></div></div>
        </div>
    </main>

    <!-- Traffic Loop & Monetization Ad Layout -->
    <footer class="p-6 text-center border-t border-slate-200 glass text-xs text-slate-500">
        <p class="mb-4">Powered by B2B Suite | Need raw data? 
            <a href="https://rapidapi.com" target="_blank" class="text-blue-600 font-bold hover:underline">
                Access our Model 2 Lead Generation API
            </a>
        </p>
    </footer>

    <!-- JavaScript Logic -->
    <script>
        function calculateVelocity(){ const opps = document.getElementById('opps').value; const rate = document.getElementById('winRate').value; const score = Math.floor(opps * (rate / 100) * 1.5); document.getElementById('velOutput').innerText = score + ' pts'; document.getElementById('velResult').classList.remove('hidden'); }
    </script>
</body>
</html>
